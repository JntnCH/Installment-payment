name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/debtor-daily-monthly-payment, feature/google-drive-receipt-storage, feature/monthly-bill-payment-history]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: TypeScript check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  validate-income-expenses:
    name: Validate income and expenses integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout income and expenses repository
        uses: actions/checkout@v4
        with:
          repository: JntnCH/Income-and-expenses-by-manus
          ref: feature/monthly-bill-payment-history
          path: income-expenses

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: income-expenses
        run: npm install --no-audit --no-fund

      - name: Lint / syntax checks
        working-directory: income-expenses
        run: npm run lint

      - name: Build checks
        working-directory: income-expenses
        run: npm run build

      - name: Integration tests
        working-directory: income-expenses
        run: |
          node test/full_flow_test.js
          node test/telegram_update_guard_test.js
