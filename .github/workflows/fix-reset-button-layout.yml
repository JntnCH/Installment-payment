name: Fix reset button layout

on:
  push:
    paths:
      - '.github/workflows/fix-reset-button-layout.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix overflow
        run: |
          python3 << 'PY'
          from pathlib import Path
          path = Path('client/src/components/LoanCalculator.tsx')
          text = path.read_text()
          old = '''                <div className="flex gap-2">
                  <input
                    type="number"
                    min="0"
                    placeholder="เช่น 3550"
                    value={dailyActualReceived}
                    onChange={(e) => {
                      const val = Number(e.target.value);
                      setDailyActualReceived(val);
                    }}
                    className="flex-1 h-10 px-3 bg-white border border-[#1C1917]/20 rounded-[10px] text-sm font-mono font-bold tabular-nums text-[#1C1917]"
                  />
                  <button
                    type="button"
                    onClick={() => {
                      const autoCalc = Math.max(0, dailyPrincipal - dailyFirstDeduct - dailyFee);
                      setDailyActualReceived(autoCalc);
                    }}
                    className="px-3 h-10 rounded-[10px] bg-white border border-[#1C1917]/15 text-xs font-medium text-[#1C1917] hover:bg-[#1C1917]/5 cursor-pointer whitespace-nowrap"
                  >
                    ↺ รีเซ็ตตามค่าหัก (฿{(dailyPrincipal - dailyFirstDeduct - dailyFee).toLocaleString()})
                  </button>
                </div>'''
          new = '''                <div className="flex flex-col gap-2 sm:flex-row sm:items-stretch">
                  <input
                    type="number"
                    min="0"
                    placeholder="เช่น 3550"
                    value={dailyActualReceived}
                    onChange={(e) => {
                      const val = Number(e.target.value);
                      setDailyActualReceived(val);
                    }}
                    className="w-full min-w-0 flex-1 h-10 px-3 bg-white border border-[#1C1917]/20 rounded-[10px] text-sm font-mono font-bold tabular-nums text-[#1C1917]"
                  />
                  <button
                    type="button"
                    onClick={() => {
                      const autoCalc = Math.max(0, dailyPrincipal - dailyFirstDeduct - dailyFee);
                      setDailyActualReceived(autoCalc);
                    }}
                    className="w-full sm:w-auto shrink-0 px-3 h-10 rounded-[10px] bg-white border border-[#1C1917]/15 text-xs font-medium text-[#1C1917] hover:bg-[#1C1917]/5 cursor-pointer whitespace-normal sm:whitespace-nowrap text-center leading-tight"
                  >
                    ↺ รีเซ็ตตามค่าหัก{" "}\n                    <span className="font-mono">(฿{(dailyPrincipal - dailyFirstDeduct - dailyFee).toLocaleString()})</span>
                  </button>
                </div>'''
          # Fix the new string - don't use escaped newline in JSX incorrectly
          new = '''                <div className="flex flex-col gap-2 sm:flex-row sm:items-stretch">
                  <input
                    type="number"
                    min="0"
                    placeholder="เช่น 3550"
                    value={dailyActualReceived}
                    onChange={(e) => {
                      const val = Number(e.target.value);
                      setDailyActualReceived(val);
                    }}
                    className="w-full min-w-0 flex-1 h-10 px-3 bg-white border border-[#1C1917]/20 rounded-[10px] text-sm font-mono font-bold tabular-nums text-[#1C1917]"
                  />
                  <button
                    type="button"
                    onClick={() => {
                      const autoCalc = Math.max(0, dailyPrincipal - dailyFirstDeduct - dailyFee);
                      setDailyActualReceived(autoCalc);
                    }}
                    className="w-full sm:w-auto shrink-0 px-3 h-10 rounded-[10px] bg-white border border-[#1C1917]/15 text-xs font-medium text-[#1C1917] hover:bg-[#1C1917]/5 cursor-pointer text-center"
                  >
                    {`↺ รีเซ็ตตามค่าหัก (฿${(dailyPrincipal - dailyFirstDeduct - dailyFee).toLocaleString()})`}
                  </button>
                </div>'''
          if old not in text:
              raise SystemExit('pattern not found')
          path.write_text(text.replace(old, new, 1))
          print('ok')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/components/LoanCalculator.tsx
          git diff --staged --quiet || git commit -m "fix(ui): stack reset-fee button under input on mobile"
          git push origin HEAD:main
