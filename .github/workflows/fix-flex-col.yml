name: Fix flex-col
on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/fix-flex-col.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch layout
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          p = Path('client/src/components/LoanCalculator.tsx')
          t = p.read_text(encoding='utf-8')
          print('size', len(t))
          if 'PLACEHOLDER' in t and len(t) < 100:
              raise SystemExit('placeholder file')
          key = 'value={dailyActualReceived}'
          idx = t.find(key)
          if idx < 0:
              raise SystemExit('dailyActualReceived missing')
          # find nearest flex gap-2 before this input
          window_start = max(0, idx - 250)
          window = t[window_start:idx]
          pos = window.rfind('className="flex gap-2"')
          if pos < 0:
              if 'flex flex-col gap-2 sm:flex-row' in t[window_start:idx+50]:
                  print('already fixed')
                  raise SystemExit(0)
              raise SystemExit('flex gap-2 not found near input')
          abs_pos = window_start + pos
          old = 'className="flex gap-2"'
          new = 'className="flex flex-col gap-2 sm:flex-row sm:items-stretch"'
          t = t[:abs_pos] + new + t[abs_pos + len(old):]
          # button class near this section
          btn_old = 'cursor-pointer whitespace-nowrap'
          btn_new = 'cursor-pointer text-center w-full sm:w-auto shrink-0'
          # only first occurrence after the actual-received block
          after = t.find(key)
          region = t[after:after+1200]
          if btn_old in region:
              t = t[:after] + region.replace(btn_old, btn_new, 1) + t[after+1200:]
          p.write_text(t, encoding='utf-8')
          print('patched ok', p.stat().st_size)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/components/LoanCalculator.tsx
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "fix(ui): stack reset-fee button under input on mobile"
            git push origin HEAD:main
          fi
